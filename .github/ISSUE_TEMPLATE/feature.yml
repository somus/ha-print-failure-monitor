name: Feature request
description: Suggest an improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve for you or your printer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and trade-offs
      description: Note effects on detection accuracy, model cost, other printers, or existing settings.
